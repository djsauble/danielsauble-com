# This workflow will deploy the Astro site to S3

on:
  push:
    branches:
      - master

name: Deploy to Amazon S3

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2
    - name: Setup Node.js environment
      uses: actions/setup-node@v3
      with:
        node-version: 24
    - name: Enable Corepack
      run: corepack enable
    - name: Install Node dependencies
      uses: borales/actions-yarn@v4
      with:
        cmd: install
    - name: Build static site
      uses: borales/actions-yarn@v4
      with:
        cmd: run build
    # Hashed assets first, so new pages never point at files that aren't there yet.
    # They're kept across deploys, since a page cached for an hour may still need them.
    - name: Deploy hashed assets to S3
      run: aws s3 sync dist/_astro/ s3://www.danielsauble.com/_astro/ --cache-control "public, max-age=31536000, immutable"
    - name: Deploy pages to S3
      run: aws s3 sync dist/ s3://www.danielsauble.com --delete --exclude "_astro/*" --cache-control "public, max-age=3600"
